<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1022">
<title>Merge Flask</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1022'/%3E%3Ccircle cx='11' cy='12' r='7' fill='%23ff6a4d'/%3E%3Ccircle cx='21' cy='20' r='7' fill='%2338c6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one phone screen. Score strip with the tier ladder, the flask, then a one-line rule and three buttons. */
:root{
  color-scheme:dark;
  --bg:#0d1022; --panel:#171a38; --line:#2c3068; --ink:#efedff; --mute:#9a9cc8;
  --glass:#bcd4ff; --go:#ffd447; --go-ink:#2b2300; --hot:#ff5a4f;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);overscroll-behavior:none}
html,body{height:100%;margin:0}
body{
  height:100dvh;
  background:var(--bg);color:var(--ink);font:14px var(--body);
  display:flex;flex-direction:column;gap:8px;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:560px;margin-inline:auto;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
.top{display:grid;grid-template-columns:1fr 1fr;row-gap:8px;font-family:var(--display);flex:0 0 auto}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat.r{align-items:flex-end}
.lab{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.num{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#score{color:var(--go)}
/* tier ladder: one dot per tier, growing left to right; tiers not reached yet this run stay dim */
#ladder{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:3px;list-style:none;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
#ladder li{flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;font:700 10px/1 var(--display);color:var(--bg);opacity:.2;transition:opacity .25s,transform .25s}
#ladder li.on{opacity:1}
#ladder li.new{transform:scale(1.25)}

#stage{position:relative;flex:1 1 0;min-height:160px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:14px;background:var(--go);color:var(--go-ink);font:700 20px/1.1 var(--display);text-align:center;pointer-events:none;white-space:nowrap}
#result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:color-mix(in srgb,var(--bg) 62%,transparent)}
#result h2{margin:0;font:700 34px/1.05 var(--display);text-wrap:balance}
#result .big{margin:0;font:700 26px/1 var(--display)}
#result .big b{color:var(--go);font-variant-numeric:tabular-nums}
#result p{margin:0 0 8px;color:var(--mute);font-size:14px}

button,.btn{font:600 15px var(--display);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:42px;padding:0 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button:active{transform:translateY(1px)}
button.go{background:var(--go);color:var(--go-ink);border-color:var(--go);font-size:20px;font-weight:700;min-height:50px;padding:0 26px}
button[aria-pressed="false"]{color:var(--mute);text-decoration:line-through}

footer{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
#hint{margin:0;font-size:13px;line-height:1.35;color:var(--mute);text-align:center;text-wrap:balance}
.acts{display:flex;gap:6px}
.acts>*{flex:1 1 0;padding:0 6px}
#build{margin:0;font-size:11px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){#ladder li{transition:none}button:active{transform:none}}
</style>
</head>
<body>

<header class="top">
  <div class="stat"><span class="lab">Score</span><span class="num" id="score">0</span></div>
  <div class="stat r"><span class="lab">Best</span><span class="num" id="best">0</span></div>
  <ol id="ladder" aria-label="Tiers reached this run"></ol>
</header>

<main id="stage">
  <canvas id="cv"></canvas>
  <div id="toast" hidden>Top tier reached!</div>
  <div id="result" hidden>
    <h2 id="resTitle">Flask overflowed</h2>
    <p class="big">Score <b id="resScore">0</b></p>
    <p id="resSub"></p>
    <button type="button" id="btnAgain" class="go">Again</button>
  </div>
</main>

<footer>
  <p id="hint">Drag to aim, let go to drop. Two of the same number merge into the next one. Keep the pile below the line.</p>
  <div class="acts">
    <button type="button" id="btnRestart">Restart</button>
    <button type="button" id="btnSound" aria-pressed="true">Sound</button>
    <a class="btn" id="lnkGames" href="lab.html">All games</a>
  </div>
  <p id="build"></p>
</footer>

<script>
//<sim>
// Pure simulation, no DOM. Balls fall into a round flask; two touching balls of the same tier merge into the next tier.
const W=360,H=560,DT=1/60,G=760;
const CX=180,CY=372,FR=150,NW=84,NECK_TOP=70,DROP_Y=40;        // flask body circle, neck half-width, where the neck glass ends
const JUNCTION_Y=CY-Math.sqrt(FR*FR-NW*NW),LINE_Y=JUNCTION_Y-2; // where neck meets body; a ball resting above LINE_Y is overflowing
const RADII=[10,14,18,22,27,33,39,46,54,63,72],TOP=RADII.length-1,SPAWN=5;   // SPAWN: drops come from the lowest N tiers
const COOLDOWN=.45,GRACE=.9,LOSE_AFTER=2,MERGE_SLOP=.6;
const SUB=3,ITER=6,DAMP=.9985,TOUCH_DAMP=.985,VMAX=900,POP_MAX=230;
const REST_V=8,REST_DAMP=.2;   // a touching ball slower than REST_V is braked hard, which works like static friction and lets piles sit still

function createFlask(rand){
  const balls=[],events=[];
  let uid=1;
  const pick=()=>(rand()*SPAWN)|0;
  const sim={balls,events,state:'play',score:0,drops:0,cool:0,danger:0,won:false,top:0,cur:0,next:0,t:0,step,drop,aimRange};
  sim.cur=pick();sim.next=pick();sim.top=sim.cur;

  function aimRange(tier){const r=RADII[tier];return [CX-NW+r+1,CX+NW-r-1]}
  function make(tier,x,y,vx,vy,age){return {id:uid++,tier,r:RADII[tier],x,y,vx,vy,px:x,py:y,age,above:0,born:sim.t,touch:0,dead:false}}
  function drop(x){
    if(sim.state!=='play'||sim.cool>0)return false;
    const range=aimRange(sim.cur);
    balls.push(make(sim.cur,Math.min(range[1],Math.max(range[0],x)),DROP_Y,0,60,0));
    sim.cool=COOLDOWN;sim.drops++;
    sim.cur=sim.next;sim.next=pick();
    if(sim.cur>sim.top)sim.top=sim.cur;
    events.push({k:'drop'});
    return true;
  }
  // Keep a ball's centre inside the body circle or the neck strip (each shrunk by the ball's radius).
  function contain(b){
    const dx=b.x-CX,dy=b.y-CY,lim=FR-b.r,d2=dx*dx+dy*dy;
    if(d2<=lim*lim)return;
    const half=NW-b.r,inNeck=half>=0&&b.y<=CY;
    if(inNeck&&dx>=-half&&dx<=half)return;
    const d=Math.sqrt(d2)||1,over=d-lim;
    if(inNeck){
      const sx=CX+Math.max(-half,Math.min(half,dx));
      if(Math.abs(b.x-sx)<over){b.x=sx;b.touch=1;return}
    }
    b.x=CX+dx/d*lim;b.y=CY+dy/d*lim;b.touch=1;
  }
  function hit(a,b){
    const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
    if(d2>=rr*rr)return;
    const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,ma=a.r*a.r,mb=b.r*b.r,tm=ma+mb,ov=rr-d;
    a.x-=nx*ov*mb/tm;a.y-=ny*ov*mb/tm;b.x+=nx*ov*ma/tm;b.y+=ny*ov*ma/tm;
    a.touch=1;b.touch=1;
  }
  // Position-based step: move, push overlaps apart several times, then read velocity back from how far each ball really moved.
  function step(){
    sim.t+=DT;
    if(sim.cool>0)sim.cool-=DT;
    const n=balls.length,h=DT/SUB;
    for(let s=0;s<SUB;s++){
      for(let i=0;i<n;i++){const b=balls[i];b.vy+=G*h;b.pre=b.vx*b.vx+b.vy*b.vy;b.px=b.x;b.py=b.y;b.touch=0;b.x+=b.vx*h;b.y+=b.vy*h}
      for(let it=0;it<ITER;it++){
        for(let i=0;i<n;i++){const a=balls[i];for(let j=i+1;j<n;j++)hit(a,balls[j])}
        for(let i=0;i<n;i++)contain(balls[i]);
      }
      for(let i=0;i<n;i++){
        const b=balls[i],k=b.touch?TOUCH_DAMP:DAMP;
        let vx=(b.x-b.px)/h*k,vy=(b.y-b.py)/h*k;
        // a ball shoved out of an overlap (a fresh merge) must not be launched: cap what the push can add
        const cap=b.touch?Math.max(Math.sqrt(b.pre),POP_MAX):VMAX,sp=vx*vx+vy*vy;
        if(sp>cap*cap){const q=cap/Math.sqrt(sp);vx*=q;vy*=q}
        else if(b.touch&&sp<REST_V*REST_V){vx*=REST_DAMP;vy*=REST_DAMP}
        b.vx=vx;b.vy=vy;
      }
    }
    if(sim.state!=='play')return;
    // merges: any two touching balls of the same tier
    let born=null;
    for(let i=0;i<n;i++){
      const a=balls[i];
      if(a.dead||a.tier>=TOP)continue;
      for(let j=i+1;j<n;j++){
        const b=balls[j];
        if(b.dead||b.tier!==a.tier)continue;
        const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r+MERGE_SLOP;
        if(dx*dx+dy*dy>rr*rr)continue;
        a.dead=b.dead=true;
        const tier=a.tier+1,nb=make(tier,(a.x+b.x)/2,(a.y+b.y)/2,(a.vx+b.vx)/2,(a.vy+b.vy)/2,GRACE);
        contain(nb);
        (born||(born=[])).push(nb);
        sim.score+=1<<tier;
        if(tier>sim.top)sim.top=tier;
        events.push({k:'merge',x:nb.x,y:nb.y,tier,r:nb.r});
        if(tier===TOP&&!sim.won){sim.won=true;events.push({k:'win',x:nb.x,y:nb.y})}
        break;
      }
    }
    if(born){
      let w=0;
      for(let i=0;i<n;i++)if(!balls[i].dead)balls[w++]=balls[i];
      balls.length=w;
      for(const b of born)balls.push(b);
    }
    // overflow: a settled ball poking above the line for too long ends the run
    let worst=0;
    for(const b of balls){
      b.age+=DT;
      if(b.age>GRACE&&b.y-b.r<LINE_Y){b.above+=DT;if(b.above>worst)worst=b.above}else b.above=0;
    }
    sim.danger=worst;
    if(worst>=LOSE_AFTER){sim.state='over';events.push({k:'lose'})}
  }
  return sim;
}
//</sim>

// ---------- Page ----------
const BUILD='Build 5';   // bump on every deploy so the phone shows which version is loaded
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL=['#38c6ff','#7c8cff','#c77dff','#ff6ac1','#ff6a4d','#ffb23e','#ffd447','#7ddc5a','#2fd6b5','#e9ecff','#ff3d7f'];
let sim=null,last=0,acc=0,shake=0,muted=false,best=0,shown=false,overFor=0,toastFor=0;
let aimX=CX,aiming=false;
const rings=[],sparks=[];

// ----- sound -----
let actx=null;
function audioOn(){
  if(muted)return;
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){actx=null}
}
function note(freq,dur,vol,type,delay){
  if(muted||!actx)return;
  try{
    const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.6,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}

// ----- effects from sim events -----
function onEvents(ev){
  for(const e of ev){
    if(e.k==='drop')note(240,.05,.05,'sine');
    else if(e.k==='merge'){
      rings.push({x:e.x,y:e.y,r0:e.r*.6,r1:e.r*1.7,life:.32,max:.32,color:PAL[e.tier]});
      const n=Math.min(12,4+e.tier);
      for(let i=0;i<n;i++){const a=Math.random()*6.283,s=50+Math.random()*110;sparks.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4,max:.4,color:PAL[e.tier],size:1.5+e.tier*.25})}
      if(e.tier>=5)shake=Math.max(shake,2+e.tier*.7);
      const f=262*Math.pow(2,e.tier*2/12);          // pitch climbs a whole tone per tier
      note(f,.16,.09,'triangle');note(f*1.5,.12,.05,'sine',.05);
    }else if(e.k==='win'){
      toastFor=2.8;$('toast').hidden=false;shake=14;
      [0,4,7,12,16].forEach((st,i)=>note(392*Math.pow(2,st/12),.3,.09,'triangle',i*.09));
      for(let i=0;i<4;i++)rings.push({x:e.x,y:e.y,r0:20,r1:150+i*40,life:.5+i*.15,max:.5+i*.15,color:PAL[TOP]});
    }else if(e.k==='lose'){
      shake=10;[7,4,0,-5].forEach((st,i)=>note(262*Math.pow(2,st/12),.3,.09,'sawtooth',i*.12));
    }
  }
  ev.length=0;
}

// ----- drawing -----
function fit(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
}
function view(){const s=Math.min(cv.width/W,cv.height/H);return {s,ox:(cv.width-W*s)/2,oy:(cv.height-H*s)/2}}
function glassPath(pad){
  // neck down the left side, round the bottom of the body, back up the right side
  const R=FR+pad,nw=NW+pad,jy=CY-Math.sqrt(R*R-nw*nw);
  ctx.beginPath();
  ctx.moveTo(CX-nw,NECK_TOP);ctx.lineTo(CX-nw,jy);
  ctx.arc(CX,CY,R,Math.atan2(jy-CY,-nw),Math.atan2(jy-CY,nw),true);
  ctx.lineTo(CX+nw,NECK_TOP);
}
function drawBall(x,y,r,tier,alpha){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=PAL[tier];ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x-r*.32,y-r*.34,r*.26,0,6.2832);ctx.fill();
  ctx.fillStyle='#0d1022';ctx.font='700 '+Math.max(8,r*.95).toFixed(1)+'px Fredoka, system-ui, sans-serif';
  ctx.fillText(String(tier+1),x,y+r*.06);
  ctx.globalAlpha=1;
}
function draw(){
  const {s,ox,oy}=view();
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const sx=calm?0:(Math.random()-.5)*shake,sy=calm?0:(Math.random()-.5)*shake;
  ctx.setTransform(s,0,0,s,ox+sx*s,oy+sy*s);
  if(!sim)return;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const danger=sim.danger>0&&sim.state==='play',play=sim.state==='play';
  // glass body
  glassPath(1.5);ctx.fillStyle='rgba(188,212,255,.05)';ctx.fill();
  // aim guide and the ball in hand
  if(play){
    const r=RADII[sim.cur],ready=sim.cool<=0;
    ctx.strokeStyle='rgba(239,237,255,.16)';ctx.lineWidth=1.5;ctx.setLineDash([5,7]);
    ctx.beginPath();ctx.moveTo(aimX,DROP_Y+r+3);ctx.lineTo(aimX,CY+FR-6);ctx.stroke();ctx.setLineDash([]);
    drawBall(aimX,DROP_Y,r,sim.cur,ready?1:.35);
    // next up
    ctx.fillStyle='#9a9cc8';ctx.font='600 10px Fredoka, system-ui, sans-serif';ctx.fillText('NEXT',W-30,16);
    drawBall(W-30,40,Math.max(7,RADII[sim.next]*.62),sim.next,1);
  }
  // balls (new ones pop in)
  for(const b of sim.balls){
    const age=sim.t-b.born,k=age<.14?.72+.28*(age/.14):1;
    drawBall(b.x,b.y,b.r*k,b.tier,1);
  }
  // overflow line
  const blink=danger&&((sim.t*6|0)%2===0);
  ctx.strokeStyle=danger?(blink?'#ff5a4f':'#ffd447'):'rgba(154,156,200,.6)';ctx.lineWidth=danger?2.5:1.5;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(CX-NW+3,LINE_Y);ctx.lineTo(CX+NW-3,LINE_Y);ctx.stroke();ctx.setLineDash([]);
  if(danger){
    // countdown sits beside the neck, clear of the ball in hand
    const tx=(CX-NW)/2;
    ctx.fillStyle='#ff5a4f';ctx.font='700 12px Fredoka, system-ui, sans-serif';ctx.fillText('OVERFLOW',tx,LINE_Y-52);
    ctx.font='700 24px Fredoka, system-ui, sans-serif';ctx.fillText(Math.max(0,LOSE_AFTER-sim.danger).toFixed(1),tx,LINE_Y-30);
  }
  // glass outline on top
  glassPath(1.5);ctx.lineWidth=3;ctx.strokeStyle=danger?'#ff9a8f':'#bcd4ff';ctx.lineJoin='round';ctx.stroke();
  // merge rings and sparks
  for(const r of rings){
    const q=1-r.life/r.max;
    ctx.globalAlpha=(1-q)*.9;ctx.strokeStyle=r.color;ctx.lineWidth=3*(1-q)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r0+(r.r1-r.r0)*q,0,6.2832);ctx.stroke();
  }
  for(const p of sparks){
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.max),0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ----- score strip -----
let sScore=-1,sTop=-1;
function buildLadder(){
  $('ladder').innerHTML=RADII.map((r,i)=>{
    const d=Math.round(13+i*1.5);
    return `<li id="tier-${i+1}" style="width:${d}px;height:${d}px;background:${PAL[i]}">${i+1}</li>`;
  }).join('');
}
function hud(){
  if(sim.score!==sScore){sScore=sim.score;$('score').textContent=sScore;if(sScore>best)$('best').textContent=sScore}
  if(sim.top!==sTop){
    const items=$('ladder').children;
    for(let i=0;i<items.length;i++){items[i].classList.toggle('on',i<=sim.top);items[i].classList.toggle('new',i===sim.top&&sim.top>=SPAWN)}
    sTop=sim.top;
  }
}

// ----- loop -----
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  fit();
  acc+=dt;
  let n=0;
  while(acc>=DT&&n<4){sim.step();onEvents(sim.events);acc-=DT;n++}
  if(n===4)acc=0;
  for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1)}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93}
  shake*=.86;if(shake<.2)shake=0;
  if(toastFor>0){toastFor-=dt;if(toastFor<=0)$('toast').hidden=true}
  if(sim.state==='over'){overFor+=dt;if(overFor>.9&&!shown)showResult()}
  draw();hud();
  requestAnimationFrame(frame);
}

// ----- flow -----
function showResult(){
  shown=true;
  const sc=sim.score,record=sc>best;
  if(record){best=sc;try{localStorage.setItem('mergeflask.best',String(sc))}catch(e){}}
  $('best').textContent=best;
  $('resTitle').textContent=sim.won?'Top tier, then overflow':'Flask overflowed';
  $('resScore').textContent=sc;
  $('resSub').textContent=(record?'New best. ':'Your best is '+best+'. ')+'Highest ball: '+(sim.top+1)+' of '+RADII.length+'.';
  $('result').hidden=false;
}
function reset(){
  sim=createFlask(Math.random);
  rings.length=0;sparks.length=0;shake=0;shown=false;overFor=0;toastFor=0;sScore=-1;sTop=-1;
  aimX=CX;aiming=false;
  $('result').hidden=true;$('toast').hidden=true;
  $('best').textContent=best;
}
function clampAim(x){const r=sim.aimRange(sim.cur);return Math.min(r[1],Math.max(r[0],x))}
function worldX(e){
  const r=cv.getBoundingClientRect(),dpr=cv.width/r.width,{s,ox}=view();
  return ((e.clientX-r.left)*dpr-ox)/s;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioOn();
  if(!sim||sim.state!=='play')return;
  aiming=true;aimX=clampAim(worldX(e));
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
});
cv.addEventListener('pointermove',e=>{
  if(!sim||sim.state!=='play')return;
  if(aiming||e.pointerType==='mouse')aimX=clampAim(worldX(e));
});
cv.addEventListener('pointerup',e=>{
  if(!aiming)return;
  aiming=false;
  if(!sim||sim.state!=='play')return;
  aimX=clampAim(worldX(e));
  if(sim.drop(aimX))aimX=clampAim(aimX);     // the next ball may be wider, so re-clamp
});
cv.addEventListener('pointercancel',()=>{aiming=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
$('btnAgain').addEventListener('click',reset);
$('btnRestart').addEventListener('click',reset);
$('btnSound').addEventListener('click',()=>{muted=!muted;$('btnSound').setAttribute('aria-pressed',String(!muted));if(!muted)audioOn()});

try{const v=parseInt(localStorage.getItem('mergeflask.best'),10);if(Number.isFinite(v)&&v>0)best=v}catch(e){}
$('build').textContent=BUILD;
buildLadder();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
