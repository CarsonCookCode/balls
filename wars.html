<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10122a">
<title>Ball Wars</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310122a'/%3E%3Ccircle cx='11' cy='12' r='7' fill='%23ff6a4d'/%3E%3Ccircle cx='21' cy='20' r='7' fill='%2338c6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one phone screen, top to bottom: score strip, the arena board, then the army sheet (setup) or a slim control bar (battle). */
:root{
  color-scheme:dark;
  --bg:#10122a; --board:#1a1d44; --panel:#181b3c; --line:#2e3270; --ink:#efedff; --mute:#9a9cc8;
  --ember:#ff6a4d; --tide:#38c6ff; --go:#ffd447; --go-ink:#2b2300;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);overscroll-behavior:none}
html,body{height:100%;margin:0}
body{
  height:100dvh;
  background:var(--bg);color:var(--ink);font:14px var(--body);
  display:flex;flex-direction:column;gap:10px;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:560px;margin-inline:auto;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}

.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;row-gap:6px;font-family:var(--display);flex:0 0 auto}
.side{display:flex;align-items:baseline;gap:8px;min-width:0}
.side.a{color:var(--ember)}
.side.b{color:var(--tide);justify-content:flex-end}
.side .name{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.side .n{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.clock{font-size:14px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.clock.ot{color:var(--go)}
.split{grid-column:1/-1;height:6px;border-radius:3px;background:var(--tide);overflow:hidden}
.split.empty{background:var(--line)}
.split i{display:block;height:100%;width:50%;background:var(--ember);transition:width .15s linear}
.split.empty i{width:0}

#stage{position:relative;flex:1 1 0;min-height:120px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:color-mix(in srgb,var(--bg) 68%,transparent);border-radius:14px}
#result h2{margin:0;font:700 40px/1 var(--display);text-wrap:balance}
#result h2.a{color:var(--ember)}
#result h2.b{color:var(--tide)}
#result p{margin:0 0 8px;color:var(--mute);font-size:14px}
#result .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

button{font:600 15px var(--display);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:40px;padding:0 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.go{background:var(--go);color:var(--go-ink);border-color:var(--go);font-size:20px;font-weight:700;min-height:50px;letter-spacing:.04em}
button[aria-pressed="false"]{color:var(--mute);text-decoration:line-through}

#sheet{display:flex;flex-direction:column;gap:8px;flex:0 1 auto;max-height:62%;overflow-y:auto}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:0 0 auto;min-height:34px;font-size:13px;border-radius:17px;padding:0 12px}
.rows{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:6px}
.step{display:flex;align-items:center;gap:2px}
.step.b{justify-content:flex-end}
.step button{width:36px;min-height:34px;padding:0;font-size:20px;line-height:1;border-radius:10px}
.step output{width:38px;text-align:center;font:600 16px var(--display);font-variant-numeric:tabular-nums}
.step.a output{color:var(--ember)}
.step.b output{color:var(--tide)}
.unit{display:flex;align-items:center;justify-content:center;gap:5px;font:600 14px var(--display);color:var(--ink);min-width:0}
.unit svg{flex:0 0 auto;color:var(--mute)}
#hint{margin:0;font-size:12.5px;line-height:1.3;color:var(--mute);text-align:center;min-height:1.3em}
.foot{margin:0;font-size:11px;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.foot a{color:var(--mute)}

#bar{display:flex;gap:6px;flex:0 0 auto}
#bar button{flex:1 1 0;padding:0 6px}

@media (prefers-reduced-motion:reduce){.split i{transition:none}button:active{transform:none}}
</style>
</head>
<body>

<header class="score">
  <div class="side a"><span class="name">Ember</span><span class="n" id="nA">0</span></div>
  <div class="clock" id="clock">0:00</div>
  <div class="side b"><span class="n" id="nB">0</span><span class="name">Tide</span></div>
  <div class="split" id="split"><i id="splitA"></i></div>
</header>

<main id="stage">
  <canvas id="cv"></canvas>
  <div id="result" hidden>
    <h2 id="resTitle"></h2>
    <p id="resSub"></p>
    <div class="acts">
      <button type="button" id="btnRematch" class="go">Rematch</button>
      <button type="button" id="btnChange">Change armies</button>
    </div>
  </div>
</main>

<section id="sheet">
  <div class="presets" id="presets"></div>
  <div class="rows" id="rows"></div>
  <p id="hint"></p>
  <button type="button" id="btnFight" class="go">Fight</button>
  <p class="foot"><a href="lab.html">All games</a> · <span id="build"></span></p>
</section>

<nav id="bar" hidden>
  <button type="button" id="btnPause">Pause</button>
  <button type="button" id="btnSpeed">1×</button>
  <button type="button" id="btnSound" aria-pressed="true">Sound</button>
  <button type="button" id="btnArmies">Armies</button>
</nav>

<script>
//<sim>
// Pure simulation: no DOM, fixed timestep, seeded. Same setup + seed gives the same battle.
const W=360,H=540,DT=1/60,CAP=2500,OVERTIME=60,BIG=11,CELL=22;
const TYPES={
  grunt:    {name:'Grunt',    r:5,  hp:30,  dmg:6,  acc:260,max:95, cd:.30,limit:600,desc:'Cheap and quick. Dies in a few hits.'},
  giant:    {name:'Giant',    r:22, hp:1600,dmg:26, acc:120,max:55, cd:.10,limit:8,  desc:'Huge and slow. Hits everything it touches.'},
  splitter: {name:'Splitter', r:9,  hp:70,  dmg:10, acc:200,max:80, cd:.30,limit:150,desc:'Bursts into two smaller balls, twice over.'},
  healer:   {name:'Healer',   r:6,  hp:45,  dmg:2,  acc:220,max:85, cd:.40,limit:100,desc:'Mends nearby allies and hangs back.'},
  bomber:   {name:'Bomber',   r:6,  hp:20,  dmg:0,  acc:300,max:120,cd:.30,limit:200,desc:'Explodes on first contact. Blasts chain.'},
  recruiter:{name:'Recruiter',r:7,  hp:150, dmg:28, acc:230,max:90, cd:.35,limit:100,desc:'Whatever it kills joins its team.'},
};
const ORDER=['grunt','giant','splitter','healer','bomber','recruiter'];
const HEAL=5,HEAL_R=42,BOOM_R=36,BOOM_DMG=55;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function createSim(setup,seed){
  const rnd=mulberry32(seed);
  const balls=[],events=[],spawns=[],booms=[],bigs=[];
  const cols=Math.ceil(W/CELL),rows=Math.ceil(H/CELL);
  const head=new Int32Array(cols*rows),next=new Int32Array(CAP+8);
  let nextId=1,tick=0;
  const sim={balls,events,t:0,over:false,winner:null,count:[0,0],overtime:false,step};

  function make(team,type,x,y,gen){
    const T=TYPES[type],r=T.r*Math.pow(.7,gen),hp=T.hp*Math.pow(.45,gen);
    return {id:nextId++,team,type,gen,x,y,vx:0,vy:0,r,m:r*r,hp,maxHp:hp,dmg:T.dmg*Math.pow(.75,gen),
      acc:T.acc,drag:T.acc/T.max,cdMax:T.cd,cd:0,hit:0,healTick:-99,target:null,follow:false,boomed:false,alive:true};
  }

  // Placement: Ember (team 0) fills the top of the board, Tide (team 1) the bottom.
  const occ=Array.from({length:cols*rows},()=>[]),placedBig=[];
  const cellOf=(x,y)=>Math.min(rows-1,Math.max(0,(y/CELL)|0))*cols+Math.min(cols-1,Math.max(0,(x/CELL)|0));
  function isFree(x,y,r){
    for(const o of placedBig){const dx=o.x-x,dy=o.y-y,rr=o.r+r+1;if(dx*dx+dy*dy<rr*rr)return false}
    if(r>BIG)return true;
    const cx=Math.min(cols-1,Math.max(0,(x/CELL)|0)),cy=Math.min(rows-1,Math.max(0,(y/CELL)|0));
    for(let yy=Math.max(0,cy-1);yy<=Math.min(rows-1,cy+1);yy++)for(let xx=Math.max(0,cx-1);xx<=Math.min(cols-1,cx+1);xx++)
      for(const o of occ[yy*cols+xx]){const dx=o.x-x,dy=o.y-y,rr=o.r+r+1;if(dx*dx+dy*dy<rr*rr)return false}
    return true;
  }
  function place(team,type){
    const r=TYPES[type].r,back=team===0?r+4:H-r-4,front=team===0?H*.4:H*.6;
    let x=0,y=0;
    for(let k=0;k<14;k++){
      x=r+4+rnd()*(W-2*r-8);
      let f=rnd();if(type==='healer')f*=.4;
      y=back+f*(front-back);
      if(isFree(x,y,r))break;
    }
    const b=make(team,type,x,y,0);balls.push(b);
    if(r>BIG)placedBig.push(b);else occ[cellOf(x,y)].push(b);
  }
  for(const type of ['giant','splitter','recruiter','bomber','healer','grunt'])
    for(let team=0;team<2;team++){
      const n=Math.min(TYPES[type].limit,(team===0?setup.a:setup.b)[type]|0);
      for(let i=0;i<n&&balls.length<CAP;i++)place(team,type);
    }
  // Shuffle so array order carries no team information; otherwise whoever is placed first gets a real edge in contact order.
  for(let i=balls.length-1;i>0;i--){const j=(rnd()*(i+1))|0,tmp=balls[i];balls[i]=balls[j];balls[j]=tmp}
  recount();

  function recount(){let a=0,b=0;for(const o of balls)o.team===0?a++:b++;sim.count[0]=a;sim.count[1]=b}

  function nearestEnemy(b){
    let best=null,bd=1e18;
    for(const o of balls){if(o.team===b.team||!o.alive)continue;const dx=o.x-b.x,dy=o.y-b.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=o}}
    return best;
  }
  function allyToTend(b){
    let hurtOne=null,hd=1e18,any=null,ad=1e18;
    for(const o of balls){
      if(o.team!==b.team||o===b||!o.alive||o.type==='healer')continue;
      const dx=o.x-b.x,dy=o.y-b.y,d=dx*dx+dy*dy;
      if(d<ad){ad=d;any=o}
      if(o.hp<o.maxHp*.9&&d<hd){hd=d;hurtOne=o}
    }
    return hurtOne||any;
  }

  function hurt(v,amt,src){
    if(!v.alive)return;
    v.hp-=amt;v.hit=.1;
    if(v.hp<=0)kill(v,src);
  }
  function kill(v,src){
    if(src&&src.type==='recruiter'&&src.alive&&v.type!=='giant'&&v.type!=='bomber'){
      v.team=src.team;v.hp=v.maxHp*.6;v.target=null;v.cd=.3;
      events.push({k:'turn',x:v.x,y:v.y,team:v.team,r:v.r});
      return;
    }
    v.alive=false;
    events.push({k:'die',x:v.x,y:v.y,team:v.team,r:v.r});
    if(v.type==='bomber'&&!v.boomed){v.boomed=true;booms.push(v)}
    if(v.type==='splitter'&&v.gen<2){
      const a=rnd()*Math.PI*2;
      for(const s of [-1,1]){
        const c=make(v.team,'splitter',v.x+Math.cos(a)*v.r*.4*s,v.y+Math.sin(a)*v.r*.4*s,v.gen+1);
        c.vx=v.vx+Math.cos(a)*70*s;c.vy=v.vy+Math.sin(a)*70*s;c.cd=.2;
        spawns.push(c);
      }
    }
  }

  function collide(a,b){
    if(!a.alive||!b.alive)return;
    const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
    if(d2>=rr*rr)return;
    const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,tm=a.m+b.m,ov=rr-d;
    a.x-=nx*ov*b.m/tm;a.y-=ny*ov*b.m/tm;b.x+=nx*ov*a.m/tm;b.y+=ny*ov*a.m/tm;
    const rvn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny,foe=a.team!==b.team;
    if(rvn<0){
      const j=-(1+(foe?.9:.2))*rvn/(1/a.m+1/b.m);
      a.vx-=j/a.m*nx;a.vy-=j/a.m*ny;b.vx+=j/b.m*nx;b.vy+=j/b.m*ny;
    }
    if(!foe)return;
    if(a.type==='bomber'&&!a.boomed){a.boomed=true;booms.push(a)}
    if(b.type==='bomber'&&!b.boomed){b.boomed=true;booms.push(b)}
    const f=Math.min(2,Math.max(.5,-rvn/50));
    const aHits=a.cd<=0&&a.dmg>0,bHits=b.cd<=0&&b.dmg>0;
    if(aHits){a.cd=a.cdMax;hurt(b,a.dmg*f,a)}
    if(bHits&&a.team!==b.team){b.cd=b.cdMax;hurt(a,b.dmg*f,b)}
  }

  function step(){
    tick++;
    const n=balls.length;
    // steer and move
    for(let i=0;i<n;i++){
      const b=balls[i];
      if(b.cd>0)b.cd-=DT;
      if(b.hit>0)b.hit-=DT;
      let tg=b.target;
      if(!tg||!tg.alive||(tg.team===b.team)!==b.follow||(tick+b.id)%24===0){
        tg=null;b.follow=false;
        if(b.type==='healer'){tg=allyToTend(b);if(tg)b.follow=true}
        if(!tg)tg=nearestEnemy(b);
        b.target=tg;
      }
      if(tg){
        const dx=tg.x-b.x,dy=tg.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        if(!(b.follow&&d<tg.r+b.r+12)){b.vx+=dx/d*b.acc*DT;b.vy+=dy/d*b.acc*DT}
      }
      const k=1-b.drag*DT;b.vx*=k;b.vy*=k;
      b.x+=b.vx*DT;b.y+=b.vy*DT;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8}else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.8}
      if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.8}else if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.8}
    }
    // collisions: small balls through a grid, big balls against everyone
    // Contacts resolve top to bottom, which favours the top army in a crowd. Mirroring the board on random ticks cancels that.
    const flip=rnd()<.5,ev0=events.length;
    if(flip)for(let i=0;i<n;i++){const b=balls[i];b.y=H-b.y;b.vy=-b.vy}
    head.fill(-1);bigs.length=0;
    for(let i=0;i<n;i++){
      const b=balls[i];
      if(b.r>BIG){bigs.push(i);continue}
      const c=cellOf(b.x,b.y);next[i]=head[c];head[c]=i;
    }
    for(let cy=0;cy<rows;cy++)for(let cx=0;cx<cols;cx++){
      const c=cy*cols+cx;
      for(let i=head[c];i!==-1;i=next[i]){
        const a=balls[i];
        for(let j=next[i];j!==-1;j=next[j])collide(a,balls[j]);
        if(cx+1<cols)for(let j=head[c+1];j!==-1;j=next[j])collide(a,balls[j]);
        if(cy+1<rows){
          if(cx>0)for(let j=head[c+cols-1];j!==-1;j=next[j])collide(a,balls[j]);
          for(let j=head[c+cols];j!==-1;j=next[j])collide(a,balls[j]);
          if(cx+1<cols)for(let j=head[c+cols+1];j!==-1;j=next[j])collide(a,balls[j]);
        }
      }
    }
    for(const bi of bigs){
      const a=balls[bi];
      for(let j=0;j<n;j++){
        if(j===bi)continue;
        const o=balls[j];
        if(o.r>BIG&&j<bi)continue;
        collide(a,o);
      }
    }
    if(flip){
      for(let i=0;i<n;i++){const b=balls[i];b.y=H-b.y;b.vy=-b.vy}
      for(const s of spawns){s.y=H-s.y;s.vy=-s.vy}
      for(let i=ev0;i<events.length;i++)events[i].y=H-events[i].y;
    }
    // explosions (may chain through other bombers)
    while(booms.length){
      const s=booms.pop();
      s.alive=false;
      events.push({k:'boom',x:s.x,y:s.y,team:s.team,r:BOOM_R});
      for(let j=0;j<n;j++){
        const o=balls[j];
        if(!o.alive||o===s)continue;
        const dx=o.x-s.x,dy=o.y-s.y,dc=Math.sqrt(dx*dx+dy*dy)||1,d=dc-o.r;
        if(d>=BOOM_R)continue;
        const f=1-Math.max(0,d)/BOOM_R,kb=200*f*Math.min(1,40/o.m);
        o.vx+=dx/dc*kb;o.vy+=dy/dc*kb;
        if(o.team!==s.team)hurt(o,BOOM_DMG*f,s);
      }
    }
    // healing pulses
    for(let i=0;i<n;i++){
      const b=balls[i];
      if(b.type!=='healer'||!b.alive||(tick+b.id*7)%30!==0)continue;
      let any=false;
      for(let j=0;j<n;j++){
        const o=balls[j];
        if(o.team!==b.team||!o.alive||o.hp>=o.maxHp||tick-o.healTick<30)continue;
        const dx=o.x-b.x,dy=o.y-b.y,rr=HEAL_R+o.r;
        if(dx*dx+dy*dy<rr*rr){o.hp=Math.min(o.maxHp,o.hp+HEAL);o.healTick=tick;any=true}
      }
      if(any)events.push({k:'heal',x:b.x,y:b.y,team:b.team,r:HEAL_R});
    }
    // overtime: everything left starts to burn, faster and faster
    if(!sim.over&&sim.t>OVERTIME){
      sim.overtime=true;
      const rate=(.03+(sim.t-OVERTIME)*.012)*DT;
      for(let i=0;i<n;i++){const o=balls[i];if(o.alive){o.hp-=o.maxHp*rate;if(o.hp<=0)kill(o,null)}}
    }
    // tidy up
    let w=0;
    for(let i=0;i<n;i++)if(balls[i].alive)balls[w++]=balls[i];
    balls.length=w;
    for(const s of spawns)if(balls.length<CAP)balls.push(s);
    spawns.length=0;
    recount();
    if(!sim.over){
      sim.t+=DT;
      const a=sim.count[0],b=sim.count[1];
      if(a===0||b===0){sim.over=true;sim.winner=a===0&&b===0?'draw':a===0?1:0}
    }
  }
  return sim;
}
//</sim>

// ---------- Page ----------
const BUILD='Build 3';   // bump on every deploy so the phone shows which version is loaded
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const css=getComputedStyle(document.documentElement);
const C={board:css.getPropertyValue('--board').trim(),line:css.getPropertyValue('--line').trim(),ink:css.getPropertyValue('--ink').trim(),
  bg:css.getPropertyValue('--bg').trim(),go:css.getPropertyValue('--go').trim(),
  team:[css.getPropertyValue('--ember').trim(),css.getPropertyValue('--tide').trim()]};
const TEAM_NAME=['Ember','Tide'];
const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const PRESETS=[
  {name:'Giant vs swarm', a:{giant:1},b:{grunt:55}},
  {name:'The plague',     a:{recruiter:5},b:{grunt:60}},
  {name:'Split or burn',  a:{splitter:15},b:{bomber:60}},
  {name:'Field medics',   a:{grunt:60,healer:10},b:{grunt:105}},
  {name:'Everything',     a:{grunt:60,giant:1,splitter:10,healer:6,bomber:10,recruiter:3},b:{grunt:60,giant:1,splitter:10,healer:6,bomber:10,recruiter:3}},
];
const blank=()=>Object.fromEntries(ORDER.map(t=>[t,0]));
const fill=o=>Object.assign(blank(),o);

let setup={a:fill(PRESETS[0].a),b:fill(PRESETS[0].b)};
let seed=1,sim=null,mode='setup',paused=false,speed=1,muted=false;
let acc=0,last=0,overFor=0,shake=0;
const parts=[],rings=[];
const newSeed=()=>(Math.random()*2147483647)|0;

// ----- sound -----
let actx=null,lastNote=0;
const PENT=[0,2,4,7,9,12,14,16];
function audioOn(){
  if(muted)return;
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){actx=null}
}
function note(freq,dur,vol,type,force){
  if(muted||!actx)return;
  const now=actx.currentTime;
  if(!force&&now-lastNote<.035)return;
  lastNote=now;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*.6,now+dur);
    g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);
    o.connect(g);g.connect(actx.destination);o.start(now);o.stop(now+dur);
  }catch(e){}
}

// ----- effects from sim events -----
function onEvents(ev){
  for(const e of ev){
    if(e.k==='die'){
      const n=Math.min(7,2+(e.r/3|0));
      for(let i=0;i<n&&parts.length<420;i++){
        const a=Math.random()*6.283,s=30+Math.random()*90;
        parts.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,max:.45,team:e.team,size:Math.max(1.2,e.r*.35)});
      }
      if(e.r>15){shake=Math.max(shake,10);note(110,.4,.2,'sawtooth',true)}
      else note((e.team?440:330)*Math.pow(2,PENT[(Math.random()*8)|0]/12),.09,.05,'triangle');
    }else if(e.k==='boom'){
      rings.push({x:e.x,y:e.y,r0:5,r1:e.r,life:.3,max:.3,color:C.go,w:3});
      shake=Math.max(shake,4);note(85,.22,.16,'sawtooth',true);
    }else if(e.k==='heal'){
      if(rings.length<120)rings.push({x:e.x,y:e.y,r0:8,r1:e.r,life:.4,max:.4,color:C.ink,w:1});
    }else if(e.k==='turn'){
      rings.push({x:e.x,y:e.y,r0:e.r,r1:e.r+12,life:.35,max:.35,color:C.team[e.team],w:2});
      note(620,.1,.04,'square');
    }
  }
  ev.length=0;
}

// ----- drawing -----
function fit(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
}
function boardPath(){
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(0,0,W,H,14);else ctx.rect(0,0,W,H);
}
function draw(){
  const cw=cv.width,ch=cv.height;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cw,ch);
  const s=Math.min(cw/W,ch/H);
  const sx=calm?0:(Math.random()-.5)*shake,sy=calm?0:(Math.random()-.5)*shake;
  ctx.setTransform(s,0,0,s,(cw-W*s)/2+sx*s,(ch-H*s)/2+sy*s);
  ctx.fillStyle=C.board;boardPath();ctx.fill();
  ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.stroke();
  ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(12,H/2);ctx.lineTo(W-12,H/2);ctx.stroke();ctx.setLineDash([]);
  if(!sim)return;
  const balls=sim.balls,TAU=6.2832;
  // bodies, one path per team, then the ones flashing from a hit
  for(let t=0;t<2;t++){
    ctx.fillStyle=C.team[t];ctx.beginPath();
    for(const b of balls){if(b.team!==t||b.hit>0)continue;ctx.moveTo(b.x+b.r,b.y);ctx.arc(b.x,b.y,b.r,0,TAU)}
    ctx.fill();
  }
  ctx.fillStyle=C.ink;ctx.beginPath();
  for(const b of balls){if(b.hit<=0)continue;ctx.moveTo(b.x+b.r,b.y);ctx.arc(b.x,b.y,b.r,0,TAU)}
  ctx.fill();
  // markings by type
  ctx.strokeStyle=C.bg;ctx.lineWidth=1.6;ctx.beginPath();
  for(const b of balls){
    if(b.r<5)continue;
    if(b.type==='splitter'){ctx.moveTo(b.x-b.r*.62,b.y);ctx.lineTo(b.x+b.r*.62,b.y)}
    else if(b.type==='healer'){const k=b.r*.55;ctx.moveTo(b.x-k,b.y);ctx.lineTo(b.x+k,b.y);ctx.moveTo(b.x,b.y-k);ctx.lineTo(b.x,b.y+k)}
  }
  ctx.stroke();
  ctx.fillStyle=C.bg;ctx.beginPath();
  for(const b of balls){if(b.type==='bomber'){ctx.moveTo(b.x+b.r*.5,b.y);ctx.arc(b.x,b.y,b.r*.5,0,TAU)}}
  ctx.fill();
  ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.beginPath();
  for(const b of balls){if(b.type==='recruiter'){ctx.moveTo(b.x+b.r+2,b.y);ctx.arc(b.x,b.y,b.r+2,0,TAU)}}
  ctx.stroke();
  for(const b of balls){
    if(b.type!=='giant')continue;
    ctx.lineWidth=4;ctx.strokeStyle=C.bg;ctx.globalAlpha=.35;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*.6,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*.6,-1.5708,-1.5708+TAU*Math.max(0,b.hp/b.maxHp));ctx.stroke();
  }
  // rings and debris
  for(const r of rings){
    const p=1-r.life/r.max;
    ctx.globalAlpha=(1-p)*.8;ctx.strokeStyle=r.color;ctx.lineWidth=r.w;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r0+(r.r1-r.r0)*p,0,TAU);ctx.stroke();
  }
  for(let t=0;t<2;t++){
    ctx.fillStyle=C.team[t];ctx.globalAlpha=.85;ctx.beginPath();
    for(const p of parts){if(p.team!==t)continue;const z=p.size*(p.life/p.max);ctx.moveTo(p.x+z,p.y);ctx.arc(p.x,p.y,z,0,TAU)}
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ----- score strip -----
let shownA=-1,shownB=-1,shownClock='';
function hud(){
  const a=sim?sim.count[0]:0,b=sim?sim.count[1]:0;
  if(a!==shownA){shownA=a;$('nA').textContent=a}
  if(b!==shownB){shownB=b;$('nB').textContent=b}
  $('split').classList.toggle('empty',a+b===0);
  if(a+b>0)$('splitA').style.width=(a/(a+b)*100).toFixed(1)+'%';
  const t=sim?sim.t:0,txt=(sim&&sim.overtime?'Overtime ':'')+((t/60)|0)+':'+String((t%60)|0).padStart(2,'0');
  if(txt!==shownClock){shownClock=txt;$('clock').textContent=txt;$('clock').classList.toggle('ot',!!(sim&&sim.overtime))}
}

// ----- main loop -----
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  fit();
  if(mode==='battle'&&!paused){
    acc+=dt*speed;
    let n=0;
    while(acc>=DT&&n<12){sim.step();onEvents(sim.events);acc-=DT;n++}
    if(n===12)acc=0;
    if(sim.over){overFor+=dt;if(overFor>.8&&$('result').hidden)showResult()}
  }
  const fdt=paused?0:dt;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=fdt;if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue}p.x+=p.vx*fdt;p.y+=p.vy*fdt;p.vx*=.94;p.vy*=.94}
  for(let i=rings.length-1;i>=0;i--){rings[i].life-=fdt;if(rings[i].life<=0){rings[i]=rings[rings.length-1];rings.pop()}}
  shake*=.86;if(shake<.2)shake=0;
  draw();hud();
  requestAnimationFrame(frame);
}

// ----- flow -----
function showResult(){
  const w=sim.winner,title=$('resTitle');
  title.className=w===0?'a':w===1?'b':'';
  title.textContent=w==='draw'?'Nobody wins':TEAM_NAME[w]+' wins';
  const left=w==='draw'?0:sim.count[w],t=sim.t;
  $('resSub').textContent=(w==='draw'?'Both armies wiped out':left+' still standing')+' after '+((t/60)|0)+':'+String((t%60)|0).padStart(2,'0');
  $('result').hidden=false;
  if(w!=='draw')[0,4,7,12].forEach((st,i)=>setTimeout(()=>note((w?440:330)*Math.pow(2,st/12),.25,.08,'triangle',true),i*90));
}
function toSetup(){
  mode='setup';paused=false;
  $('sheet').hidden=false;$('bar').hidden=true;$('result').hidden=true;
  parts.length=0;rings.length=0;
  sim=createSim(setup,seed);
}
function fight(){
  if(total('a')===0||total('b')===0)return;
  audioOn();
  mode='battle';paused=false;acc=0;overFor=0;
  parts.length=0;rings.length=0;
  sim=createSim(setup,seed);
  $('sheet').hidden=true;$('bar').hidden=false;$('result').hidden=true;
  $('btnPause').textContent='Pause';
}
const total=side=>ORDER.reduce((s,t)=>s+setup[side][t],0);

// ----- army sheet -----
function icon(t){
  const d='var(--bg)',c='currentColor';
  const r={grunt:4.5,giant:8,splitter:6.5,healer:5.5,bomber:5.5,recruiter:5}[t];
  const inner={grunt:'',
    giant:`<circle cx="9" cy="9" r="4.6" fill="none" stroke="${d}" stroke-width="1.6"/>`,
    splitter:`<path d="M4 9h10" stroke="${d}" stroke-width="1.8"/>`,
    healer:`<path d="M9 5.2v7.6M5.2 9h7.6" stroke="${d}" stroke-width="1.8"/>`,
    bomber:`<circle cx="9" cy="9" r="2.8" fill="${d}"/>`,
    recruiter:`<circle cx="9" cy="9" r="7.6" fill="none" stroke="${c}" stroke-width="1.2"/>`}[t];
  return `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="${r}" fill="${c}"/>${inner}</svg>`;
}
function stepHTML(side,t){
  const team=side==='a'?'Ember':'Tide',nm=TYPES[t].name.toLowerCase();
  return `<div class="step ${side}"><button type="button" id="${side}-${t}-less" data-side="${side}" data-type="${t}" data-d="-1" aria-label="Fewer ${team} ${nm}s">−</button>`+
    `<output id="${side}-${t}-n">0</output>`+
    `<button type="button" id="${side}-${t}-more" data-side="${side}" data-type="${t}" data-d="1" aria-label="More ${team} ${nm}s">+</button></div>`;
}
function buildSheet(){
  $('rows').innerHTML=ORDER.map(t=>`<div class="row" data-type="${t}">${stepHTML('a',t)}<div class="unit">${icon(t)}<span>${TYPES[t].name}</span></div>${stepHTML('b',t)}</div>`).join('');
  $('presets').innerHTML=PRESETS.map((p,i)=>`<button type="button" id="preset-${i}" data-preset="${i}">${p.name}</button>`).join('')+
    `<button type="button" id="preset-shuffle" data-preset="shuffle">Shuffle</button>`;
}
const DEFAULT_HINT='Ember starts at the top, Tide at the bottom. Set both armies, then fight.';
function refresh(){
  for(const side of ['a','b'])for(const t of ORDER)$(side+'-'+t+'-n').textContent=setup[side][t];
  $('btnFight').disabled=total('a')===0||total('b')===0;
  try{localStorage.setItem('ballwars.setup',JSON.stringify(setup))}catch(e){}
  if(mode==='setup')sim=createSim(setup,seed);
}
function change(side,t,d){
  const v=Math.min(TYPES[t].limit,Math.max(0,setup[side][t]+d));
  if(v===setup[side][t])return;
  setup[side][t]=v;
  $('hint').textContent=TYPES[t].name+': '+TYPES[t].desc;
  refresh();
}
function shuffle(){
  const army=()=>{const o=blank();o.grunt=(Math.random()*120)|0;
    if(Math.random()<.4)o.giant=1+((Math.random()*2)|0);
    if(Math.random()<.5)o.splitter=(Math.random()*30)|0;
    if(Math.random()<.5)o.healer=(Math.random()*14)|0;
    if(Math.random()<.5)o.bomber=(Math.random()*40)|0;
    if(Math.random()<.4)o.recruiter=(Math.random()*8)|0;
    if(ORDER.every(t=>o[t]===0))o.grunt=40;
    return o};
  setup={a:army(),b:army()};
}
let holdT=0,holdI=0;
function stopHold(){clearTimeout(holdT);clearInterval(holdI);holdT=holdI=0}
$('rows').addEventListener('pointerdown',e=>{
  const row=e.target.closest('.row');
  if(row)$('hint').textContent=TYPES[row.dataset.type].name+': '+TYPES[row.dataset.type].desc;
  const b=e.target.closest('button[data-d]');
  if(!b)return;
  e.preventDefault();
  const side=b.dataset.side,t=b.dataset.type,d=+b.dataset.d;
  change(side,t,d);
  stopHold();
  let reps=0;
  holdT=setTimeout(()=>{holdI=setInterval(()=>{reps++;change(side,t,d*(reps>40?10:reps>15?5:1))},70)},350);
});
$('rows').addEventListener('click',e=>{            // keyboard activation only; touch is handled on pointerdown
  const b=e.target.closest('button[data-d]');
  if(b&&e.detail===0)change(b.dataset.side,b.dataset.type,+b.dataset.d);
});
for(const ev of ['pointerup','pointercancel','blur'])window.addEventListener(ev,stopHold);
document.addEventListener('contextmenu',e=>e.preventDefault());
$('presets').addEventListener('click',e=>{
  const b=e.target.closest('button[data-preset]');
  if(!b)return;
  if(b.dataset.preset==='shuffle')shuffle();
  else{const p=PRESETS[+b.dataset.preset];setup={a:fill(p.a),b:fill(p.b)}}
  seed=newSeed();
  $('hint').textContent=DEFAULT_HINT;
  refresh();
});
$('btnFight').addEventListener('click',fight);
$('btnRematch').addEventListener('click',()=>{seed=newSeed();fight()});
$('btnChange').addEventListener('click',toSetup);
$('btnArmies').addEventListener('click',toSetup);
$('btnPause').addEventListener('click',()=>{paused=!paused;$('btnPause').textContent=paused?'Resume':'Pause'});
$('btnSpeed').addEventListener('click',()=>{speed=speed===1?2:speed===2?4:1;$('btnSpeed').textContent=speed+'×'});
$('btnSound').addEventListener('click',()=>{muted=!muted;$('btnSound').setAttribute('aria-pressed',String(!muted));if(!muted)audioOn()});

// ----- boot -----
function validSetup(s){return s&&s.a&&s.b&&ORDER.every(t=>Number.isFinite(s.a[t])&&Number.isFinite(s.b[t]))}
function start(data){
  let saved=data&&data.setup;
  if(!validSetup(saved)){try{saved=JSON.parse(localStorage.getItem('ballwars.setup'))}catch(e){saved=null}}
  if(validSetup(saved))setup={a:fill(saved.a),b:fill(saved.b)};
  if(data&&typeof data.muted==='boolean')muted=data.muted;
  $('btnSound').setAttribute('aria-pressed',String(!muted));
  seed=newSeed();
  buildSheet();
  $('hint').textContent=DEFAULT_HINT;
  $('build').textContent=BUILD;
  refresh();
  toSetup();
  requestAnimationFrame(frame);
}
start({});
</script>
</body>
</html>
