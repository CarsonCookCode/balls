<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1022">
<title>Ball Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1022'/%3E%3Ccircle cx='11' cy='12' r='7' fill='%23ff6a4d'/%3E%3Ccircle cx='21' cy='20' r='7' fill='%2338c6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a short list of experiments, one tappable row each. Add a row per new game file. */
:root{
  color-scheme:dark;
  --bg:#0d1022; --panel:#171a38; --line:#2c3068; --ink:#efedff; --mute:#9a9cc8;
  --ember:#ff6a4d; --tide:#38c6ff; --go:#ffd447;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);
  display:flex;flex-direction:column;gap:18px;
  padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:560px;margin-inline:auto;
}
h1{margin:0;font:700 34px/1 var(--display)}
.sub{margin:6px 0 0;color:var(--mute)}
.games{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.games a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);text-decoration:none}
.games a:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.games a:active{transform:translateY(1px)}
.games h2{margin:0;font:600 20px/1.1 var(--display)}
.games p{margin:3px 0 0;color:var(--mute);font-size:14px}
.games svg{flex:0 0 auto}
.arrow{font:600 22px var(--display);color:var(--mute)}
#build{margin:auto 0 0;font-size:11px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Ball Lab</h1>
  <p class="sub">Playable physics experiments. Pick one.</p>
</header>

<ul class="games">
  <li><a id="lnkJar" href="jar.html">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect x="7" y="5" width="30" height="34" rx="6" fill="none" stroke="#bcd4ff" stroke-width="2.5"/><circle cx="16" cy="31" r="5" fill="#38c6ff"/><circle cx="27" cy="31" r="5" fill="#c77dff"/><circle cx="21.5" cy="22" r="5" fill="#ffd447"/></svg>
    <div><h2>Jar Breaker</h2><p>Tap to split the balls. Break the jar in the fewest strikes.</p></div>
    <span class="arrow" aria-hidden="true">›</span>
  </a></li>
  <li><a id="lnkWars" href="wars.html">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="14" cy="15" r="9" fill="#ff6a4d"/><circle cx="30" cy="29" r="9" fill="#38c6ff"/></svg>
    <div><h2>Ball Wars</h2><p>Build two armies of balls and watch which one survives.</p></div>
    <span class="arrow" aria-hidden="true">›</span>
  </a></li>
</ul>

<p id="build">Build 3</p>
</body>
</html>
